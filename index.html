<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>zod2go playground</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
        line-height: 1.5;
      }
      body {
        margin: 0 auto;
        max-width: 960px;
        padding: 1.5rem;
      }
      h1 {
        margin-bottom: 0.25rem;
      }
      .subtitle {
        opacity: 0.75;
        margin-top: 0;
      }
      label {
        display: block;
        font-weight: 600;
        margin: 1rem 0 0.35rem;
      }
      textarea {
        width: 100%;
        min-height: 8rem;
        font-family: ui-monospace, monospace;
        font-size: 0.9rem;
        box-sizing: border-box;
      }
      pre {
        background: color-mix(in srgb, CanvasText 8%, Canvas);
        padding: 0.75rem;
        overflow: auto;
        border-radius: 6px;
        font-size: 0.85rem;
      }
      .ok {
        color: #0a7;
      }
      .err {
        color: #c33;
      }
      button {
        margin-top: 0.75rem;
        padding: 0.45rem 0.9rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>zod2go</h1>
    <p class="subtitle">
      Validate JSON with real Zod v4 schemas and preview the exported IR for Go.
    </p>

    <label for="input">JSON input</label>
    <textarea id="input" spellcheck="false"></textarea>
    <button id="validate" type="button">Validate with Zod</button>

    <label>Result</label>
    <pre id="result">Click validate…</pre>

    <label>Exported IR (for Go runtime)</label>
    <pre id="ir"></pre>

    <script type="module" src="/demo/main.ts"></script>
  </body>
</html>
