name: Verify
on: [push, pull_request]
jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: 1.23.6
      - run: npm ci
      - run: npm run verify
      - run: go vet ./...
      - run: go test -race ./...
      - run: npm exec vite build -- --config ts/vite.config.ts
      - run: npm run export:fixtures && git diff --exit-code -- testdata
      - run: npm pack -w @zod2go/export --pack-destination /tmp
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-coverage
          path: |
            /tmp/zod2go-native-fixture-reports
            /tmp/zod2go-runtime-fixture-reports
